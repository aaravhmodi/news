<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#faf8f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Brief">
<title>The Brief</title>
<style>
  :root { color-scheme: light; --paper: #faf8f3; --ink: #22211f; --muted: #625f59; --rule: #d5d0c6; --accent: #8a2925; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .skip { position: absolute; left: 1rem; top: -6rem; padding: .75rem; background: var(--paper); z-index: 3; }
  .skip:focus { top: .5rem; }
  .masthead, .topics, main, footer { max-width: 52rem; margin-inline: auto; }
  .masthead { padding: 2rem 1.25rem 1.25rem; }
  .eyebrow { margin: 0 0 .5rem; color: var(--accent); font-size: .7rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
  h1 { margin: 0; font: 700 3.25rem/1 Georgia, "Times New Roman", serif; letter-spacing: -.055em; }
  .updated { margin: .8rem 0 0; color: var(--muted); font-size: .8rem; }
  .topic-nav { position: sticky; top: 0; z-index: 2; background: var(--paper); border-top: 3px double var(--ink); border-bottom: 1px solid var(--rule); }
  .topics { display: flex; overflow-x: auto; padding: 0 .75rem; scrollbar-width: none; }
  .topics::-webkit-scrollbar { display: none; }
  .topics a { flex: 0 0 auto; display: flex; align-items: center; min-height: 52px; padding: .75rem .75rem; border-bottom: 3px solid transparent; font-size: .85rem; font-weight: 600; white-space: nowrap; text-decoration: none; }
  .topics a[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .topics a:focus-visible { outline-offset: -5px; }
  main { padding: 0 1.25rem; }
  section { scroll-margin-top: 5rem; padding-top: 1.75rem; }
  [hidden] { display: none !important; }
  .section-heading { display: flex; flex-wrap: wrap; align-items: baseline; gap: .5rem 1rem; padding-bottom: .75rem; border-bottom: 1px solid var(--ink); }
  h2 { margin: 0; font: 700 1.4rem/1.2 Georgia, "Times New Roman", serif; }
  .section-heading span { margin-left: auto; color: var(--muted); font-size: .75rem; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { padding: 1.15rem 0; border-bottom: 1px solid var(--rule); }
  h3 { margin: 0; font: 400 1.25rem/1.35 Georgia, "Times New Roman", serif; overflow-wrap: anywhere; }
  h3 a { display: block; min-height: 44px; text-decoration: none; }
  h3 a:visited { color: var(--muted); }
  li:first-child { padding-block: 1.5rem; }
  li:first-child h3 { font-size: 1.85rem; font-weight: 700; line-height: 1.2; letter-spacing: -.025em; }
  .story-meta { margin: .5rem 0 0; color: var(--muted); font-size: .8rem; overflow-wrap: anywhere; }
  .story-meta span { padding-inline: .3rem; }
  .empty { padding-block: 1.5rem; color: var(--muted); }
  footer { padding: 2rem 1.25rem max(2rem, env(safe-area-inset-bottom)); color: var(--muted); font-size: .75rem; }
  @media (hover: hover) { h3 a:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .15em; } .topics a:hover { color: var(--accent); } }
  @media (min-width: 640px) {
    .masthead { padding-top: 3rem; }
    .topics { flex-wrap: wrap; }
    h1 { font-size: 4.5rem; }
    section { padding-top: 2.25rem; }
    li { padding-block: 1.4rem; }
    h3 { font-size: 1.4rem; }
    li:first-child h3 { font-size: 2.5rem; }
  }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to stories</a>
<header class="masthead">
  <p class="eyebrow">The daily news digest</p>
  <h1>The Brief</h1>
  <p class="updated">Updated <time datetime="%UPDATED%">%UPDATED%</time></p>
</header>
<nav class="topic-nav" aria-label="News topics"><div class="topics">%NAV%</div></nav>
<main id="main" tabindex="-1">
%SECTIONS%
</main>
<footer>Headlines from the outlets' own RSS feeds. Each link goes to the original story.</footer>
<script>
  // Enhance ordinary fragment links only after all sections are available.
  (() => {
    const tablist = document.querySelector('.topics');
    const tabs = Array.from(tablist.querySelectorAll('a'));
    const panels = tabs.map(tab => document.getElementById(tab.hash.slice(1)));
    if (!tabs.length || panels.some(panel => !panel)) return;
    const defaultIndex = Math.max(0, tabs.findIndex(tab => tab.textContent === 'Top Stories'));
    let activeIndex = defaultIndex;
    tablist.setAttribute('role', 'tablist');
    tablist.setAttribute('aria-label', 'News topics');
    tabs.forEach((tab, index) => {
      tab.setAttribute('role', 'tab');
      tab.setAttribute('aria-controls', panels[index].id);
      panels[index].setAttribute('role', 'tabpanel');
      panels[index].setAttribute('aria-labelledby', tab.id);
      panels[index].tabIndex = 0;
    });
    function revealTab(index) {
      const tab = tabs[index];
      const box = tab.getBoundingClientRect();
      const viewport = tablist.getBoundingClientRect();
      if (box.left < viewport.left) tablist.scrollLeft += box.left - viewport.left;
      else if (box.right > viewport.right) tablist.scrollLeft += box.right - viewport.right;
    }
    function select(index) {
      const focusWouldHide = panels.some((panel, i) => i !== index && panel.contains(document.activeElement));
      activeIndex = index;
      tabs.forEach((tab, i) => {
        tab.setAttribute('aria-selected', String(i === index));
        tab.tabIndex = i === index ? 0 : -1;
        panels[i].hidden = i !== index;
      });
      if (focusWouldHide) tabs[index].focus({ preventScroll: true });
      revealTab(index);
    }
    function fromHash() {
      // Non-topic anchors (including the skip link) keep the current view.
      const index = tabs.findIndex(tab => tab.hash === location.hash);
      select(index >= 0 ? index : !location.hash ? defaultIndex : activeIndex);
    }
    function activate(index) {
      if (location.hash !== tabs[index].hash) history.pushState(null, '', tabs[index].hash);
      select(index);
    }
    tabs.forEach((tab, index) => {
      tab.addEventListener('click', event => {
        if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        activate(index);
      });
      // Manual activation: arrows move focus; Enter or Space opens the topic.
      tab.addEventListener('keydown', event => {
        let next;
        if (event.key === 'ArrowRight') next = (index + 1) % tabs.length;
        else if (event.key === 'ArrowLeft') next = (index + tabs.length - 1) % tabs.length;
        else if (event.key === 'Home') next = 0;
        else if (event.key === 'End') next = tabs.length - 1;
        else if (event.key === ' ' || event.key === 'Enter') {
          event.preventDefault();
          activate(index);
          return;
        } else return;
        event.preventDefault();
        tabs.forEach((item, i) => { item.tabIndex = i === next ? 0 : -1; });
        tabs[next].focus({ preventScroll: true });
        revealTab(next);
      });
    });
    window.addEventListener('hashchange', fromHash);
    window.addEventListener('popstate', fromHash);
    fromHash();
  })();
  if (typeof Intl.RelativeTimeFormat === 'function') {
    const rtf = new Intl.RelativeTimeFormat('en', { numeric: 'auto' });
    for (const t of document.querySelectorAll('time')) {
      const m = (new Date(t.dateTime) - Date.now()) / 6e4;
      if (!Number.isFinite(m)) continue;
      t.title = new Date(t.dateTime).toLocaleString();
      t.textContent = m > -60 ? rtf.format(Math.round(m), 'minute')
        : m > -1440 ? rtf.format(Math.round(m / 60), 'hour')
        : rtf.format(Math.round(m / 1440), 'day');
    }
  }
</script>
</body>
</html>
