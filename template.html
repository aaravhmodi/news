<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161514" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Brief">
<title>The Brief</title>
<style>
  :root { --bg: #f7f5f0; --ink: #1a1a1a; --muted: #6b6760; --rule: #d9d5cc; --accent: #8a1c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161514; --ink: #e8e6e1; --muted: #9a958c; --rule: #33312e; --accent: #d77a6a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { max-width: 44rem; margin: 0 auto; padding: 1.5rem 1rem .75rem;
           border-bottom: 3px double var(--ink); }
  h1 { margin: 0; font: 700 2.2rem/1 Georgia, "Times New Roman", serif; letter-spacing: -.01em; }
  header p { margin: .35rem 0 0; color: var(--muted); font-size: .85rem; }
  nav { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--rule);
        display: flex; gap: 1.1rem; overflow-x: auto; padding: .6rem max(1rem, calc(50% - 21rem));
        font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; scrollbar-width: none; }
  nav a { color: var(--ink); text-decoration: none; white-space: nowrap; }
  main { max-width: 44rem; margin: 0 auto; padding: 0 1rem 3rem; }
  section { scroll-margin-top: 2.5rem; }
  h2 { margin: 1.75rem 0 .25rem; color: var(--accent); font-size: .78rem;
       text-transform: uppercase; letter-spacing: .1em; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { padding: .7rem 0; border-bottom: 1px solid var(--rule); }
  li a { display: block; color: var(--ink); text-decoration: none;
         font: 1.06rem/1.3 Georgia, "Times New Roman", serif; }
  li:first-child a { font-size: 1.35rem; font-weight: 700; }
  li a:visited { color: var(--muted); }
  li span { display: block; margin-top: .25rem; color: var(--muted); font-size: .78rem; }
  footer { color: var(--muted); font-size: .75rem; margin-top: 2rem; }
</style>
</head>
<body>
<header>
  <h1>The Brief</h1>
  <p>Updated <time datetime="%UPDATED%">%UPDATED%</time></p>
</header>
<nav>%NAV%</nav>
<main>
%SECTIONS%
<footer>Headlines from the outlets' own RSS feeds. Each link goes to the original story.</footer>
</main>
<script>
  const rtf = new Intl.RelativeTimeFormat("en", { numeric: "auto" });
  for (const t of document.querySelectorAll("time")) {
    const m = (new Date(t.dateTime) - Date.now()) / 6e4;
    t.textContent = m > -60 ? rtf.format(Math.round(m), "minute")
      : m > -1440 ? rtf.format(Math.round(m / 60), "hour")
      : rtf.format(Math.round(m / 1440), "day");
  }
</script>
</body>
</html>
