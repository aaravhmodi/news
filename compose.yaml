# The news brief. The page is published only on the server's Tailscale address.
services:
  news:
    build: .
    restart: unless-stopped
    user: "1000:1000"
    env_file:
      # Same NTFY_TOPIC as every other push from this server.
      - ../../homelab/alerts/.env
      # OPENAI_API_KEY for the daily AI brief; without it the page uses the feeds' summaries.
      - path: .env
        required: false
    environment:
      SITE_URL: http://100.76.57.23:8097/
    volumes:
      - ./data:/app/data
    ports:
      - "100.76.57.23:8097:8097"
